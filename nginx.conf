server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Imagens das questões, servidas pelo backend (wwwroot/midia)
    location /midia/ {
        proxy_pass http://backend:8080/midia/;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
