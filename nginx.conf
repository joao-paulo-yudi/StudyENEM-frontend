# Ponto de entrada único da aplicação: serve o Angular em / e encaminha /api e /midia
# para o backend. Atrás do Cloudflare Tunnel, o esquema original (https) chega em
# X-Forwarded-Proto e é repassado ao backend; sem proxy na frente, vale o $scheme local.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker: o nome "backend" é resolvido a cada 10s, então recriar o
    # container da API (que muda de IP) não exige reiniciar o nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    # Regras extras montadas só pelo ambiente de avaliação (portão de convite); no desenvolvimento a
    # pasta não existe e nada é incluído.
    include /etc/nginx/avaliacao/*.conf;

    # Com proxy_pass por variável e sem URI, o caminho original (/api/...) é repassado intacto.
    location /api/ {
        proxy_pass $backend;
    }

    # Saúde da API e do banco ("Healthy"/"Unhealthy"), para o monitor externo da avaliação remota.
    location = /health {
        proxy_pass $backend;
        add_header Cache-Control "no-store";
    }

    # Imagens das questões, servidas pelo backend (wwwroot/midia)
    location /midia/ {
        proxy_pass $backend;
        expires 7d;
    }

    # Arquivos com hash no nome (outputHashing: all) nunca mudam de conteúdo.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html sempre revalidado, para que um novo build chegue ao navegador sem limpar cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: qualquer rota desconhecida cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
