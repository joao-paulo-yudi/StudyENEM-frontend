<div class="app-shell">
  @if (!fullscreen) {
    <app-sidebar [activeRoute]="activeRoute" />
    <div class="scrim" [class.scrim-show]="layout.drawerOpen()" (click)="layout.closeDrawer()" aria-hidden="true"></div>
  }

  <div class="main-column">
    @if (!fullscreen) {
      <!-- Barra superior: só aparece quando a lateral vira gaveta (mobile) -->
      <header class="topbar">
        <button #menuBtn class="topbar-menu" (click)="layout.toggleSidebar()"
                aria-label="Abrir menu de navegação" aria-controls="app-sidebar"
                [attr.aria-expanded]="layout.drawerOpen()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <svg width="24" height="24" viewBox="0 0 40 40" fill="none" class="topbar-logo" aria-hidden="true">
          <rect x="2" y="2" width="36" height="36" rx="10" fill="#0F1B3D"/>
          <path d="M11 26 L11 14 L17 14 L17 26 Z" fill="#F26B3A"/>
          <path d="M20 26 L20 18 L26 18 L26 26 Z" fill="#FFD166"/>
          <path d="M29 26 L29 10 L31 10 L31 26 Z" fill="#8DD5C0"/>
        </svg>
        <span class="topbar-title">{{ sectionTitle }}</span>
      </header>
    }

    <div class="main-scroll">
      <router-outlet />
    </div>
  </div>
</div>
