<aside class="sidebar">
  <!-- Logo -->
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
      <rect x="2" y="2" width="36" height="36" rx="10" fill="#0F1B3D"/>
      <path d="M11 26 L11 14 L17 14 L17 26 Z" fill="#F26B3A"/>
      <path d="M20 26 L20 18 L26 18 L26 26 Z" fill="#FFD166"/>
      <path d="M29 26 L29 10 L31 10 L31 26 Z" fill="#8DD5C0"/>
    </svg>
    <div class="brand-text">
      <div class="brand-name">StudyENEM</div>
      <div class="brand-sub">Learning Analytics</div>
    </div>
  </div>

  <!-- Nav -->
  <nav class="nav">
    @for (n of nav; track n.id) {
      <button [class]="activeRoute === n.id ? 'nav-btn nav-btn-active' : 'nav-btn nav-btn-idle'"
              (click)="go(n.id)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          @switch (n.icon) {
            @case ('home') {
              <path d="M3 11 L12 4 L21 11 V20 a1 1 0 0 1 -1 1 H4 a1 1 0 0 1 -1 -1 Z"/>
              <path d="M9 21 V13 H15 V21"/>
            }
            @case ('play') {
              <circle cx="12" cy="12" r="9"/>
              <path d="M10 9 L16 12 L10 15 Z" fill="currentColor"/>
            }
            @case ('chart') {
              <path d="M3 21 H21"/>
              <rect x="5" y="11" width="3" height="8"/>
              <rect x="10.5" y="6" width="3" height="13"/>
              <rect x="16" y="14" width="3" height="5"/>
            }
            @case ('book') {
              <path d="M4 4 H10 a3 3 0 0 1 3 3 V20 a2 2 0 0 0 -2 -2 H4 Z"/>
              <path d="M20 4 H14 a3 3 0 0 0 -3 3 V20 a2 2 0 0 1 2 -2 H20 Z"/>
            }
            @case ('list') {
              <path d="M8 6 H20 M8 12 H20 M8 18 H20"/>
              <circle cx="4" cy="6" r="1" fill="currentColor"/>
              <circle cx="4" cy="12" r="1" fill="currentColor"/>
              <circle cx="4" cy="18" r="1" fill="currentColor"/>
            }
          }
        </svg>
        <span>{{ n.label }}</span>
      </button>
    }
  </nav>

  <div class="spacer"></div>

  <!-- Countdown -->
  <div class="countdown">
    <div class="countdown-label">Próximo ENEM</div>
    <div class="countdown-days">{{ daysLeft }} dias</div>
    <div class="countdown-date">1º dia · 8 nov 2026</div>
  </div>

  <!-- User -->
  <div class="user-card">
    <div class="user-avatar">{{ initials }}</div>
    <div class="user-info">
      <div class="user-name">{{ studentName }}</div>
      <div class="user-role">Estudante ENEM</div>
    </div>
    <button (click)="logout()" title="Sair" aria-label="Sair" class="user-logout">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21 H5 a2 2 0 0 1 -2 -2 V5 a2 2 0 0 1 2 -2 h4"/><path d="M16 17 L21 12 L16 7"/><path d="M21 12 H9"/>
      </svg>
    </button>
  </div>
</aside>
